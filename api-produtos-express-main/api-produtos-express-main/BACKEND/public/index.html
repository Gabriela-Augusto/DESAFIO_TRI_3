<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <img src="./IMAGENS/1000115458.png" alt="Minha foto" class="foto-perfil">
        <h1>Cadastro de Produtos</h1>
        <form id="produto-form">
            <label>Nome:</label>
            <input type="text" id="nome" required>
            
            <label>Preço:</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>
            
            <label>Quantidade:</label>
            <input type="number" id="quantidade" min="1" step="1" required>

            <button type="submit">Adicionar Produto</button>
        </form>

        <button id="limpar-tabela">Limpar tabela</button>

        <h3 id="total-estoque">Total em Estoque: R$ 0.00</h3>

        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Total item</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>

</html>
